[newrelic]
app_name = InsightFace API
license_key = %(NEW_RELIC_LICENSE_KEY)s

monitor_mode = true
log_level = info
log_file = stderr

high_security = false

transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5
transaction_tracer.function_trace =

error_collector.enabled = true
error_collector.ignore_errors =
error_collector.ignore_status_codes = 100-102 200-208 226 300-308 404

browser_monitoring.auto_instrument = false

thread_profiler.enabled = true

distributed_tracing.enabled = true

span_events.enabled = true
span_events.max_samples_stored = 2000

custom_insights_events.enabled = true
custom_insights_events.max_samples_stored = 3000

application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.metrics.enabled = true
application_logging.local_decorating.enabled = false

machine_learning.enabled = true
machine_learning.inference_events_value.enabled = true

infinite_tracing.trace_observer_host =

code_level_metrics.enabled = true

instrumentation.graphql.capture_introspection_queries = false

slow_sql.enabled = true

[newrelic:development]
monitor_mode = false
log_level = debug

[newrelic:staging]
app_name = InsightFace API (Staging)

[newrelic:production]
monitor_mode = true
log_level = warning
