# Applies labels to a pull request based on the paths it changes.
# The rules live in .github/labeler.yml.

name: Labeler

on: [pull_request_target]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
